services:
  api:
    build: ./Backend
    ports:
      - "3000:3000"
    env_file: ./Backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal

  client:
    build: ./Frontend
    ports:
      - "5173:80"
    depends_on:
      - api
